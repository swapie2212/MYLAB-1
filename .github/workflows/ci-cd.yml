name: Node DevOps CI/CD

on:
  push:
    branches:
      - sandbox

jobs:

  provision-infra:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.instance_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg curl software-properties-common
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install terraform -y

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform
        env:
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: infra/terraform
        run: |
          terraform_output=$(terraform output -raw instance_ip || echo '')
          echo "instance_ip=$(echo $terraform_output | tr -d '[:space:]')" >> $GITHUB_OUTPUT

  setup-node:
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Write PEM key from secret
        run: |
          mkdir -p infra/terraform
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > infra/terraform/ec2-instance.pem
          chmod 600 infra/terraform/ec2-instance.pem

      - name: Generate Ansible Inventory
        run: |
          echo "[devops_node]" > infra/ansible/inventory.ini
          echo "${{ needs.provision-infra.outputs.instance_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=infra/terraform/ec2-instance.pem ansible_ssh_common_args='-o StrictHostKeyChecking=no'" >> infra/ansible/inventory.ini

      - name: Install Ansible
        run: |
          sudo apt update && sudo apt install -y ansible

      - name: Run Ansible Playbook (Docker only)
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --tags docker

  install-k8s:
    needs: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      - name: Run Ansible (kubectl & minikube)
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --tags kubectl,minikube

  deploy-app:
    needs: install-k8s
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      - name: Run Ansible (app deploy)
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --tags k8s_deploy

  monitoring:
    needs: deploy-app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible
      - name: Run Ansible (Prometheus)
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml --tags prometheus
