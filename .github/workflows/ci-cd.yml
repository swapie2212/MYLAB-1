name: Node CI/CD

on:
  push:
    branches:
      - devops

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Build Backend
        run: |
          cd backend
          npm install
          npm test
      
      - name: Build Frontend
        run: |
          cd frontend
          npm install
      
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/node-devops-backend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-devops-backend:latest

      - name: Build and Push Frontend Image
        run: |
          cd frontend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/node-devops-frontend:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-devops-frontend:latest
