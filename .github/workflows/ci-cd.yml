name: Node DevOps CI/CD

on:
  push:
    branches:
      - devops

jobs:
  provision-infra:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.instance_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: infra/terraform  
        run: |
          set -e
          terraform_output=$(terraform output -raw instance_ip 2>/dev/null || echo "")
          if [[ "$terraform_output" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "INSTANCE_IP=$terraform_output" >> $GITHUB_OUTPUT
          else
            echo "Invalid IP or Terraform output failed. Skipping export."
            exit 1
          fi
          
  configure-node:
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Ansible Inventory with EC2 IP
        run: |
          echo "[devops_node]" > infra/ansible/inventory.ini
          echo "${{ needs.provision-infra.outputs.instance_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=infra/terraform/ec2-instance.pem" >> infra/ansible/inventory.ini

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml
