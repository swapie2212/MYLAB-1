name: Node DevOps CI/CD

on:
  push:
    branches:
      - devops

jobs:
  provision-infra:
    runs-on: ubuntu-latest
    outputs:
      instance_ip: ${{ steps.get_ip.outputs.instance_ip }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        run: |
          sudo apt-get update && sudo apt-get install -y gnupg software-properties-common curl
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install terraform -y

      - name: Terraform Init & Apply
        run: |
          terraform init
          terraform apply -auto-approve
        working-directory: infra/terraform
        env:
          TF_VAR_key_name: ${{ secrets.KEY_NAME }}

      - name: Get EC2 Public IP
        id: get_ip
        working-directory: infra/terraform  
        run: |
          set -e
          echo "Using Terraform binary at: $(which terraform)"
          terraform version
          terraform_output=$(command terraform output -raw instance_ip 2>/dev/null || echo "")
          terraform_output=$(echo "$terraform_output" | tr -d '"[:space:]')
          echo "Sanitized IP: '$terraform_output'"
          if [[ "$terraform_output" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "instance_ip=$terraform_output" >> $GITHUB_OUTPUT
          else
            echo "Invalid IP or Terraform output failed. Skipping export."
            exit 1
          fi
          

  configure-node:
    needs: provision-infra
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Ansible Inventory with EC2 IP
        run: |
          echo "[devops_node]" > infra/ansible/inventory.ini
          echo "${{ needs.provision-infra.outputs.instance_ip }} ansible_user=ubuntu ansible_ssh_private_key_file=infra/terraform/ec2-instance.pem" >> infra/ansible/inventory.ini

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Run Ansible Playbook
        run: |
          ansible-playbook -i infra/ansible/inventory.ini infra/ansible/playbook.yml
