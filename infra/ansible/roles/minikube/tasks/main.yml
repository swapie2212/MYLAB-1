- name: Install conntrack (required by Kubernetes)
  apt:
    name: conntrack
    state: present
    update_cache: yes

- name: Install crictl (required by Kubernetes)
  get_url:
    url: https://github.com/kubernetes-sigs/cri-tools/releases/download/v1.29.0/crictl-v1.29.0-linux-amd64.tar.gz
    dest: /tmp/crictl.tar.gz

- name: Extract crictl binary
  unarchive:
    src: /tmp/crictl.tar.gz
    dest: /usr/local/bin/
    remote_src: yes

- name: Set executable permissions for crictl
  file:
    path: /usr/local/bin/crictl
    mode: '0755'
    state: file

- name: Install cri-dockerd dependencies
  apt:
    name:
      - git
      - golang
      - make
      - cmake
    state: present
    update_cache: yes
    
- name: Clone cri-dockerd source
  git:
    repo: https://github.com/Mirantis/cri-dockerd.git
    dest: /tmp/cri-dockerd
    version: "master"

- name: Build cri-dockerd binary
  shell: |
    mkdir -p /tmp/cri-dockerd/bin
    cd /tmp/cri-dockerd
    make cri-dockerd
    cp ./cri-dockerd /usr/local/bin/
  args:
    executable: /bin/bash

- name: Disable fs.protected_regular to allow Minikube lock file
  sysctl:
    name: fs.protected_regular
    value: 0
    state: present
    sysctl_set: yes
    reload: yes

- name: Start Minikube with none driver
  shell: |
    minikube start --driver=none
    minikube update-context
  environment:
    CHANGE_MINIKUBE_NONE_USER: "true"
  args:
    executable: /bin/bash

- name: Wait for Kubernetes API to become available
  shell: |
    for i in {1..10}; do
      kubectl get nodes && break
      echo "Waiting for Kubernetes to be ready..."
      sleep 10
    done
  args:
    executable: /bin/bash