- name: Wait for backend pod to be ready
  shell: |
    kubectl wait --for=condition=ready pod -l app=backend --timeout=90s
  args:
    executable: /bin/bash

- name: Wait until backend metrics endpoint is up
  shell: |
    kubectl port-forward svc/backend 4000:4000 &
    PORT_FORWARD_PID=$!
    for i in {1..10}; do
      if curl -sSf http://localhost:4000/metrics; then
        kill $PORT_FORWARD_PID
        exit 0
      fi
      echo "Waiting for /metrics to be ready..."
      sleep 5
    done
    kill $PORT_FORWARD_PID
    echo "Timeout waiting for metrics endpoint"
    exit 1
  args:
    executable: /bin/bash

- name: Create Prometheus config directory
  file:
    path: /etc/prometheus
    state: directory

- name: Copy Prometheus config
  copy:
    src: ../../../../prometheus/prometheus.yml
    dest: /etc/prometheus/prometheus.yml